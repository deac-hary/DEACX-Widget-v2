name: Android CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch instead of burning CI minutes
# on a push that's already outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # This repo has no Gradle Wrapper committed, so Gradle itself is
      # provisioned here at an exact, pinned version instead of relying on
      # ./gradlew. setup-gradle downloads, caches, and puts this exact
      # version on PATH — see the project README for why there's no
      # wrapper and how to switch back to one later if you want to.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
